<script>
const SB_URL='https://yocjztsueqaiyvpsmvea.supabase.co';
const SB_KEY='sb_publishable_Gz7k5JFZOWURFQU6FcIl0A_kuwoNh9e';
let cloudSession=null,cloudRole=null,cloudTimer=null;
const operationalModules=new Set(['compras','vendamaterial','vendamo','moestoque','proprio','producao','romaneio','estoque','outro_operacional']);
function cloudStatus(msg){document.getElementById('cloudStatus').textContent='Nuvem: '+msg}
async function sb(path,{method='GET',body=null,token=null}={}){let headers={'apikey':SB_KEY,'Content-Type':'application/json'};if(token)headers.Authorization='Bearer '+token;let response=await fetch(SB_URL+path,{method,headers,body:body===null?undefined:JSON.stringify(body),cache:'no-store'});let raw=await response.text();let data;try{data=raw?JSON.parse(raw):null}catch{data=raw}if(!response.ok)throw Error((data&& (data.msg||data.message||data.error_description||data.error))||('HTTP '+response.status));return data}
async function cloudToken(){if(!cloudSession)throw Error('Faça login novamente');if(Date.now()<cloudSession.expires_at-90000)return cloudSession.access_token;let data=await sb('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:cloudSession.refresh_token}});cloudSession={access_token:data.access_token,refresh_token:data.refresh_token,expires_at:Date.now()+data.expires_in*1000,user:data.user};sessionStorage.setItem('migplast_cloud_session',JSON.stringify(cloudSession));return cloudSession.access_token}
async function cloudLogin(email,password){let data=await sb('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password}});cloudSession={access_token:data.access_token,refresh_token:data.refresh_token,expires_at:Date.now()+data.expires_in*1000,user:data.user};let profile=await sb('/rest/v1/migplast_usuarios?select=papel,nome&usuario_id=eq.'+encodeURIComponent(data.user.id),{token:data.access_token});if(!profile.length||!['administrador','operador'].includes(profile[0].papel))throw Error('Usuário sem perfil autorizado');cloudRole=profile[0].papel;sessionStorage.setItem('migplast_cloud_session',JSON.stringify(cloudSession));document.getElementById('authScreen').hidden=true;document.getElementById('cloudBar').hidden=false;document.getElementById('cloudWho').textContent=(profile[0].nome||email)+' ('+cloudRole+')';document.getElementById('cloudUploadBtn').hidden=cloudRole!=='administrador';if(cloudRole==='operador'){db=[];docs=[];bank={};fin={contas:[],movimentos:[],saldos:[]};page='inicio'}cloudStatus('conectado; sincronização manual de teste');render()}
function cloudLogout(){cloudSession=null;cloudRole=null;sessionStorage.removeItem('migplast_cloud_session');location.reload()}
function cloudGuid(){return crypto.randomUUID()}
// Sincronização manual conservadora: adiciona registros ausentes, sem apagar registros remotos.
async function cloudFetchAll(table,token){
  let result=[];
  for(let offset=0;offset<100000;offset+=1000){
    const rows=await sb('/rest/v1/'+table+'?select=modulo,dados&order=criado_em.asc&limit=1000&offset='+offset,{token});
    if(!Array.isArray(rows))throw Error('Resposta inválida da nuvem');
    result.push(...rows);
    if(rows.length<1000)return result;
  }
  throw Error('Limite de registros atingido; sincronização interrompida por segurança.');
}
function cloudRecordKey(r){
  return r&&r.id!=null&&String(r.id).trim()?'id:'+String(r.id):'json:'+JSON.stringify(r);
}
async function cloudUpload(){
  if(cloudRole!=='administrador')return alert('Apenas o administrador pode enviar dados.');
  if(!confirm('Enviar lançamentos que ainda não estão na nuvem? Faça backup JSON do celular antes. Este envio NÃO exclui registros da nuvem.'))return;
  const button=document.getElementById('cloudUploadBtn');
  if(button)button.disabled=true;
  try{
    cloudStatus('comparando registros...');
    const token=await cloudToken();
    const op=await cloudFetchAll('migplast_operacional',token);
    const priv=await cloudFetchAll('migplast_financeiro',token);
    const opKeys=new Set(op.filter(x=>x.dados).map(x=>cloudRecordKey(x.dados)));
    const privKeys=new Set(priv.filter(x=>x.dados&&x.modulo!=='snapshot_financeiro').map(x=>cloudRecordKey(x.dados)));
    const pendingOp=[],pendingPriv=[];
    const localRecords=[...db,...docs.map(d=>({...d,modulo:'romaneio'}))];
    for(const r of localRecords){
      if(!r||!r.modulo)continue;
      const operational=operationalModules.has(r.modulo);
      const keys=operational?opKeys:privKeys;
      const key=cloudRecordKey(r);
      if(keys.has(key))continue;
      // Protege contra a duplicação do lançamento legado de 752 kg, mesmo com outro ID.
      const legacy=r.modulo==='moestoque'&&r.movimento==='Lavado pronto'&&r.data==='2026-10-23'&&
        String(r.cliente||'').trim().toUpperCase()==='IVC EMBALAGENS'&&
        moMaterialBase(r.material)==='aparas branca'&&Math.abs(n(r.kg)-752)<0.001;
      if(legacy&&op.some(x=>x.dados&&x.dados.modulo==='moestoque'&&
        x.dados.movimento==='Lavado pronto'&&x.dados.data===r.data&&
        String(x.dados.cliente||'').trim().toUpperCase()==='IVC EMBALAGENS'&&
        moMaterialBase(x.dados.material)==='aparas branca'&&Math.abs(n(x.dados.kg)-752)<0.001))continue;
      (operational?pendingOp:pendingPriv).push({modulo:r.modulo,dados:r,criado_por:cloudSession.user.id});
      keys.add(key);
    }
    const snapshotExists=priv.some(x=>x.modulo==='snapshot_financeiro');
    const localFinanceHasData=(fin.contas?.length||0)+(fin.movimentos?.length||0)+(fin.saldos?.length||0)>0||
      Object.values(bank||{}).some(v=>Boolean(v));
    const addSnapshot=localFinanceHasData&&!snapshotExists;
    if(!confirm('Serão enviados '+pendingOp.length+' registros operacionais/romaneios, '+pendingPriv.length+
      ' registros financeiros e '+(addSnapshot?'1 snapshot financeiro':'nenhum snapshot financeiro')+
      '. Nenhum registro existente será apagado. Continuar?'))return;
    for(const [table,items] of [['migplast_operacional',pendingOp],['migplast_financeiro',pendingPriv]]){
      for(let i=0;i<items.length;i+=100){
        cloudStatus('enviando '+table+': '+Math.min(i+100,items.length)+'/'+items.length);
        await sb('/rest/v1/'+table,{method:'POST',token,body:items.slice(i,i+100)});
      }
    }
    if(addSnapshot){
      await sb('/rest/v1/migplast_financeiro',{method:'POST',token,body:[{
        modulo:'snapshot_financeiro',dados:{financeiro:fin,dadosBancarios:bank},
        criado_por:cloudSession.user.id
      }]});
    }
    const opCheck=await cloudFetchAll('migplast_operacional',token);
    const privCheck=await cloudFetchAll('migplast_financeiro',token);
    const verify=(items,rows)=>items.every(x=>rows.some(y=>y.modulo===x.modulo&&cloudRecordKey(y.dados)===cloudRecordKey(x.dados)));
    if(!verify(pendingOp,opCheck)||!verify(pendingPriv,privCheck)||
      (addSnapshot&&!privCheck.some(x=>x.modulo==='snapshot_financeiro')))
      throw Error('Não foi possível confirmar todos os registros. Confira a nuvem antes de repetir.');
    cloudStatus('envio confirmado');
    alert('Envio confirmado! Novos registros: '+(pendingOp.length+pendingPriv.length)+
      '. '+(snapshotExists?'Já existe um financeiro na nuvem; ele foi preservado.':'')+
      ' No computador, use Receber da nuvem.');
  }catch(e){
    cloudStatus('atenção: '+e.message);
    alert('Envio não confirmado: '+e.message+' Confira antes de repetir.');
  }finally{if(button)button.disabled=false;}
}
async function cloudDownload(){
  if(!confirm('Receber dados da nuvem e juntar aos dados deste aparelho, sem apagar lançamentos locais? Faça backup JSON antes.'))return;
  try{
    cloudStatus('recebendo...');
    const token=await cloudToken();
    const op=await cloudFetchAll('migplast_operacional',token);
    const priv=cloudRole==='administrador'?await cloudFetchAll('migplast_financeiro',token):[];
    const incoming=op.filter(x=>x.modulo!=='romaneio').map(x=>x.dados);
    if(cloudRole==='administrador')incoming.push(...priv.filter(x=>x.modulo!=='snapshot_financeiro').map(x=>x.dados));
    const keys=new Set(db.map(cloudRecordKey));
    let added=0;
    for(const r of incoming){if(!r)continue;const k=cloudRecordKey(r);if(!keys.has(k)){db.push(r);keys.add(k);added++;}}
    const docKeys=new Set(docs.map(cloudRecordKey));
    for(const x of op.filter(x=>x.modulo==='romaneio')){
      if(x.dados&&!docKeys.has(cloudRecordKey(x.dados))){docs.push(x.dados);docKeys.add(cloudRecordKey(x.dados));}
    }
    if(cloudRole==='administrador'){
      const snapshots=priv.filter(x=>x.modulo==='snapshot_financeiro');
      const snapshot=snapshots.at(-1);
      if(snapshot){
        const remoteFin=snapshot.dados?.financeiro;
        if(remoteFin){
          for(const name of ['contas','movimentos','saldos']){
            if(!Array.isArray(fin[name]))fin[name]=[];
            const current=new Set(fin[name].map(cloudRecordKey));
            for(const item of remoteFin[name]||[]){const k=cloudRecordKey(item);if(!current.has(k)){fin[name].push(item);current.add(k);}}
          }
        }
        for(const [k,v] of Object.entries(snapshot.dados?.dadosBancarios||{})){
          if(!bank[k])bank[k]=v;
        }
      }
      if(!save()||!saveFin()||!saveDocs())throw Error('Falha ao salvar os dados recebidos localmente');
    }
    page='inicio';render();cloudStatus('recebido: '+added+' novos lançamentos');
    alert('Recebimento concluído: '+added+' novos lançamentos. Dados locais preservados. Alterações em registros com o mesmo ID não são mescladas automaticamente.');
  }catch(e){cloudStatus('erro: '+e.message);alert('Erro ao receber: '+e.message);}
}

</script>

function gerarArquivoRomaneioPDF(id){
const d=docs.find(x=>String(x.id)===String(id));if(!d)throw Error('Romaneio não encontrado.');
const norm=t=>String(t??'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E]/g,'-');
const escPDF=t=>norm(t).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
const pageW=595,pageH=842,left=42,right=553;
let pages=[],ops=[],y=795;
function txt(t,x,sz=10,bold=false){ops.push('BT /'+(bold?'F2':'F1')+' '+sz+' Tf 1 0 0 1 '+x+' '+y+' Tm ('+escPDF(t)+') Tj ET')}
function line(){ops.push('0.7 w '+left+' '+y+' m '+right+' '+y+' l S')}
function newPage(){if(ops.length)pages.push(ops.join('\n'));ops=[];y=795}
function row(t,sz=10,bold=false,indent=0){if(y<65)newPage();txt(t,left+indent,sz,bold);y-=sz+8}
function wrap(t,width=90){let words=norm(t).split(/\s+/),lines=[],cur='';for(const w of words){if((cur+' '+w).trim().length>width){if(cur)lines.push(cur);cur=w}else cur=(cur+' '+w).trim()}if(cur)lines.push(cur);return lines}
row('MIGPLAST - RECICLAGEM DE PLASTICOS',17,true);row('ROMANEIO '+(d.modulo==='vendamo'?'DE SERVICOS':'DE VENDA DE MATERIAL'),12,true);y-=5;line();y-=18;
row('Romaneio: '+d.id+'     Data: '+d.data,11,true);
for(const l of wrap('Cliente: '+d.cliente,80))row(l,11,true);
y-=5;row('MATERIAIS',12,true);line();y-=16;
d.itens.forEach((i,k)=>{
for(const l of wrap((k+1)+'. '+i.material,82))row(l,10,true);
row('Peso: '+fmt(i.kg)+' kg    Preco/kg: '+brl(i.preco)+'    Subtotal: '+brl(n(i.kg)*n(i.preco)),9,false,12);
y-=3;
});
if(y<205)newPage();
line();y-=18;
row('PESO TOTAL: '+fmt(d.itens.reduce((a,i)=>a+n(i.kg),0))+' kg',12,true);
row('VALOR TOTAL: '+brl(d.itens.reduce((a,i)=>a+n(i.kg)*n(i.preco),0)),12,true);
y-=10;row('DADOS PARA PAGAMENTO',12,true);line();y-=16;
const b=d.banco||{};
for(const [label,key] of [['Favorecido','favorecido'],['Chave Pix','pix'],['Banco','banco'],['Agencia','agencia'],['Conta','conta'],['Tipo de conta','tipo']])for(const l of wrap(label+': '+(b[key]||'Nao informado'),85))row(l,10);
y-=18;row('Recebido por: ________________________________________',10);
row('Data do recebimento: ____/____/________',10);
y-=12;for(const l of wrap('Documento comercial de controle e entrega. Nao substitui NF-e ou NFS-e.',90))row(l,8);
newPage();
const encoder=new TextEncoder();
const objs=[null,'<< /Type /Catalog /Pages 2 0 R >>',null,
'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'];
const pageRefs=[];
for(const content of pages){
const pageNum=objs.length;
const contentNum=pageNum+1;
pageRefs.push(pageNum+' 0 R');
objs.push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pageW+' '+pageH+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+contentNum+' 0 R >>');
const len=encoder.encode(content).length;
objs.push('<< /Length '+len+' >>\nstream\n'+content+'\nendstream');
}
objs[2]='<< /Type /Pages /Kids ['+pageRefs.join(' ')+'] /Count '+pageRefs.length+' >>';
let chunks=['%PDF-1.4\n'],offsets=[0],offset=encoder.encode(chunks[0]).length;
for(let i=1;i<objs.length;i++){offsets[i]=offset;let part=i+' 0 obj\n'+objs[i]+'\nendobj\n';chunks.push(part);offset+=encoder.encode(part).length}
let xref='xref\n0 '+objs.length+'\n0000000000 65535 f \n';
for(let i=1;i<objs.length;i++)xref+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
let tail='trailer\n<< /Size '+objs.length+' /Root 1 0 R >>\nstartxref\n'+offset+'\n%%EOF';
chunks.push(xref+tail);
const bytes=encoder.encode(chunks.join(''));
const safe=norm(d.cliente).replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,35);
return new File([bytes],'Romaneio_MigPlast_'+safe+'_'+norm(d.id)+'.pdf',{type:'application/pdf'});
}

const custosEtapas=etapas.map(etapa=>{
const kg=producao.filter(r=>r.etapa===etapa).reduce((a,r)=>a+n(r.kg),0);
const gasto=data.filter(r=>ops.includes(r.modulo)&&r.etapa===etapa).reduce((a,r)=>a+total(r),0);
return {etapa,kg,gasto,custoKg:kg?gasto/kg:null};
});
const gastoGeral=data.filter(r=>ops.includes(r.modulo)&&(!r.etapa||r.etapa==='Geral')).reduce((a,r)=>a+total(r),0);
const custoEtapasHTML=`<div class="panel"><h3>Custos separados por etapa de produção</h3><p class="hint">Registre os quilos no módulo Produção por Etapa e escolha a etapa em cada despesa, frete, salário, diarista ou triagem. Custos gerais e registros antigos ficam separados para evitar rateios arbitrários.</p><div class="scroll"><table><thead><tr><th>Etapa</th><th>Produzido</th><th>Custos vinculados</th><th>Custo por kg</th></tr></thead><tbody>${custosEtapas.map(x=>`<tr><td>${x.etapa}</td><td>${fmt(x.kg)} kg</td><td>${brl(x.gasto)}</td><td>${x.custoKg===null?'Sem produção cadastrada':brl(x.custoKg)+'/kg'}</td></tr>`).join('')}<tr><th>Custos gerais / sem etapa</th><td>—</td><th>${brl(gastoGeral)}</th><td>Não rateado</td></tr></tbody></table></div><p class="hint">Custo por kg de cada etapa = custos diretamente atribuídos à etapa ÷ kg produzidos nessa etapa. Para obter custo completo do produto acabado, ainda é necessário definir o rateio dos custos gerais e vincular lotes, perdas e custos de matéria-prima.</p></div>`;
const compraPorMat={};
for(const r of db.filter(x=>x.modulo==='compras'&&(!reportEnd||x.data<=reportEnd))){let k=r.material,x=compraPorMat[k]||(compraPorMat[k]={kg:0,valor:0});x.kg+=n(r.kg);x.valor+=total(r)}
const linhas={};
for(const r of vendas){let key=r.modulo+'|||'+r.material,x=linhas[key]||(linhas[key]={modulo:r.modulo,material:r.material,kg:0,receita:0});x.kg+=n(r.kg);x.receita+=total(r)}
let custoMaterialEstimado=0,semCompra=0;
let rows=Object.values(linhas).map(x=>{let preco=x.kg?x.receita/x.kg:0,cp=x.modulo==='vendamaterial'&&compraPorMat[x.material]?.kg?compraPorMat[x.material].valor/compraPorMat[x.material].kg:0,temBase=x.modulo==='vendamo'||!!compraPorMat[x.material]?.kg;if(x.modulo==='vendamaterial'&&!temBase)semCompra++;let mat=x.modulo==='vendamaterial'?cp*x.kg:0;custoMaterialEstimado+=mat;let op=custoOpKg*x.kg,custoKg=custoOpKg+cp,margem=preco?(preco-custoKg)/preco*100:0;return {...x,preco,cp,custoKg,op,mat,resultado:x.receita-op-mat,margem,temBase}});
const receita=vendas.reduce((a,r)=>a+total(r),0),resultado=receita-custoOp-custoMaterialEstimado;
return `<div class="panel no-print"><div class="row"><h2>🧮 Custo operacional e margem por kg</h2><button class="secondary" onclick="window.print()">🖨 Imprimir / PDF</button></div><div class="fields"><div><label>De</label><input type="date" value="${reportStart}" onchange="setFilter('start',this.value)"></div><div><label>Até</label><input type="date" value="${reportEnd}" onchange="setFilter('end',this.value)"></div></div><button class="secondary" onclick="reportStart='';reportEnd='';render()">Todo o período</button><p class="hint">O custo operacional é rateado pelos kg faturados no período. Compras de material são tratadas separadamente para evitar contar estoque não vendido como despesa operacional.</p></div>
<div class="panel"><h3>Resumo do período</h3><div class="summary"><div>Kg faturados (venda + serviço)<b>${fmt(kgTotal)} kg</b></div><div>Custos operacionais<b>${brl(custoOp)}</b></div><div>Custo operacional / kg<b>${kgTotal?brl(custoOpKg)+'/kg':'—'}</b></div><div>Receita faturada<b>${brl(receita)}</b></div><div>Resultado estimado após rateio<b>${kgTotal&&semCompra===0?brl(resultado):'Base incompleta'}</b></div></div>
${custoEtapasHTML}<h3>Composição do custo operacional</h3><div class="scroll"><table><thead><tr><th>Conta</th><th>Total</th><th>Por kg faturado</th></tr></thead><tbody>${[['Fretes','fretes'],['Despesas gerais','despesas'],['Salários','salarios'],['Diaristas','diaristas'],['M.O. Triagem','triagem']].map(([label,k])=>`<tr><td>${label}</td><td>${brl(sum(k))}</td><td>${kgTotal?brl(sum(k)/kgTotal):'—'}</td></tr>`).join('')}<tr><th>Total operacional</th><th>${brl(custoOp)}</th><th>${kgTotal?brl(custoOpKg):'—'}</th></tr></tbody></table></div>
<h3>Preço de venda × custo × margem por material</h3><div class="scroll"><table><thead><tr><th>Operação</th><th>Material</th><th>Kg</th><th>Venda / kg</th><th>Compra / kg estimada</th><th>Operação / kg</th><th>Custo total / kg</th><th>Margem estimada</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.modulo==='vendamo'?'Serviço M.O.':'Venda material'}</td><td>${esc(x.material)}</td><td>${fmt(x.kg)}</td><td>${brl(x.preco)}</td><td>${x.modulo==='vendamo'?'Não se aplica':x.temBase?brl(x.cp):'Sem custo de compra'}</td><td>${brl(custoOpKg)}</td><td>${x.temBase?brl(x.custoKg):'—'}</td><td>${x.temBase?fmt(x.margem)+'%':'—'}</td></tr>`).join('')||'<tr><td colspan="8">Cadastre vendas ou serviços para calcular o custo por kg.</td></tr>'}</tbody></table></div>
<p class="hint"><b>Como calculamos:</b> custo operacional/kg = (fretes + despesas + salários + diaristas + triagem) ÷ kg faturados. Na venda de material, soma-se o custo médio histórico de compra/kg do mesmo material; nos serviços M.O., não há compra de material. Margem estimada = (preço/kg − custo/kg) ÷ preço/kg × 100.</p>
<p class="hint"><b>Atenção:</b> este é um rateio gerencial simplificado. Não separa automaticamente custos entre operações, não considera perdas/rendimento, estoque inicial, tributos, depreciação nem custo real por lote. Se houver material comprado fora do módulo Compras, a margem fica indisponível. Cadastre todos os gastos e use o filtro de datas para analisar um período completo. Não interprete o resultado como lucro contábil.</p></div>`;
}
function painelHTML(){
let sm=id=>db.filter(r=>r.modulo===id).reduce((a,r)=>a+total(r),0),q=id=>db.filter(r=>r.modulo===id).reduce((a,r)=>a+n(r.kg),0);
let own=Object.values(stock('proprio')),mo=Object.values(stock('moestoque')),totalVenda=own.reduce((a,x)=>a+materialBalance(x.material),0),valorVenda=own.reduce((a,x)=>a+materialBalance(x.material)*x.preco,0);

const linhasOwn=(value)=>own.filter(x=>materialBalance(x.material)>0).map(x=>`${x.material}: ${value?brl(materialBalance(x.material)*x.preco):fmt(materialBalance(x.material))+' kg'}`);
const linhasMo=(key,value)=>mo.filter(x=>x[key]>0).map(x=>`${x.cliente} / ${x.material}: ${value?brl(x[key]*x.preco):fmt(x[key])+' kg'}`);

${card('Compras de material',brl(sm('compras')),[fmt(q('compras'))+' kg comprados'],'compras')}
${card('Fretes',brl(sm('fretes')),[],'fretes')}
${card('Venda de material',brl(sm('vendamaterial')),[fmt(q('vendamaterial'))+' kg vendidos'],'vendamaterial')}
${card('Venda de M.O.',brl(sm('vendamo')),[fmt(q('vendamo'))+' kg faturados'],'vendamo')}
${card('Despesas gerais',brl(sm('despesas')),[],'despesas')}

${card('Diaristas',brl(sm('diaristas')),[],'diaristas')}

</div><div class="alerta ${status}">${msg}<div class="subalerta">${info} Margem financeira: ${receita?fmt(resultado/receita*100)+'%':'não disponível'}.</div></div><p class="hint">Os valores de estoque são estimativas de precificação, não faturamento. O saldo é financeiro e ainda não representa lucro líquido contábil.</p>`}
function report(){
